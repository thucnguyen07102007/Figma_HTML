<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <!-- import styles -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="auth-container">
      <div class="img-mobile">
        <img src="images/background_auth_mobile.png" alt="Logo" />
      </div>
      <div class="auth-left">
        <div class="heading">Get Started Now</div>
        <div class="form">
          <div class="form-name">
            <div class="form-label">Name</div>
            <input type="text" placeholder="Enter your name" />
          </div>
          <div class="form-email">
            <div class="form-label">Email address</div>
            <input type="email" placeholder="Enter your email" />
          </div>
          <div class="form-password">
            <div class="form-label">Password</div>

            <input type="password" placeholder="Enter your password" />
          </div>
          <div class="form-remember">
            <input type="checkbox" id="terms" />
            <label for="terms">Remember for 30 days</label>
          </div>
        </div>
        <div class="form-button">
          <button>Sign Up</button>
        </div>
        <div class="form-or">
          <div class="form-or-line"></div>
          <div class="form-or-text">Or</div>
          <div class="form-or-line"></div>
        </div>
        <div class="form-social">
          <div class="form-icons">
            <div class="form-icon">
              <div class="form-icon1">
                <img src="images/icon_google.svg" alt="" />
              </div>
              <div class="form-icon-text">Sign in with Google</div>
            </div>
            <div class="form-icon">
              <div class="form-icon1">
                <img src="images/icon_apple.svg" alt="" />
              </div>
              <div class="form-icon-text">Sign in with Apple</div>
            </div>
          </div>
          <div class="form-signin">
            <div>Don’t have an account?</div>
            <a href="login.html">Sign In</a>
          </div>
        </div>
      </div>
      <div class="auth-right">
        <img src="images/background_auth.png" alt="Logo" width="100" />
      </div>
    </div>
  </body>
</html>
