<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <!-- import styles -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-left">
        <div>
          <div class="heading">Welcome back!</div>
          <div class="heading1">
            Enter your Credentials to access your account
          </div>
        </div>

        <div class="form">
          <div class="form-email">
            <div class="form-label">Email address</div>
            <input id="email" type="email" placeholder="Enter your email" />
          </div>
          <div class="form-password">
            <div class="form-label">Password</div>
            <input
              id="password"
              type="password"
              placeholder="Enter your password"
            />
          </div>
          <div class="form-remember">
            <input type="checkbox" id="terms" />
            <label for="terms">Remember for 30 days</label>
          </div>
        </div>
        <div class="form-button">
          <button id="signin-bt">Sign In</button>
        </div>
        <div id="form-help" class="form-help">
          Mật khẩu phải có ít nhất 8 ký tự, bao gồm chữ hoa, chữ thường, số và
          ký tự đặc biệt.
        </div>
        <div class="form-or">
          <div class="form-or-line"></div>
          <div class="form-or-text">Or</div>
          <div class="form-or-line"></div>
        </div>
        <div class="form-social">
          <div class="form-icons">
            <div class="form-icon">
              <div class="form-icon1">
                <img src="images/icon_google.svg" alt="" />
              </div>
              <div class="form-icon-text">Sign in with Google</div>
            </div>
            <div class="form-icon">
              <div class="form-icon1">
                <img src="images/icon_apple.svg" alt="" />
              </div>
              <div class="form-icon-text">Sign in with Apple</div>
            </div>
          </div>
          <div class="form-signin">
            <div>Don’t have an account?</div>
            <a href="index.html">Sign Up</a>
          </div>
        </div>
      </div>
      <div class="auth-right">
        <img src="images/background_auth.png" alt="Logo" width="100" />
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
